name: Publish checkout

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OCI tag (empty → each .asd :version)"
        required: false
        default: ""
        type: string
      packager_version:
        description: "Packager image version"
        required: false
        default: "latest"
        type: string

jobs:
  publish:
    # One package per .asd: without SYSTEM the reusable workflow publishes
    # only xml-protocol and skips the sibling xml-backend-native.asd.
    strategy:
      fail-fast: false
      matrix:
        system:
          - xml-protocol
          - xml-backend-native
    uses: egao1980/cl-repository/.github/workflows/publish-source.yml@main
    with:
      system: ${{ matrix.system }}
      version: ${{ inputs.version }}
      packager-version: ${{ inputs.packager_version }}
    permissions:
      contents: read
      packages: write
